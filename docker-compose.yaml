networks:
  openstatus:
    driver: bridge
    name: openstatus

volumes:
  libsql-data:
    name: openstatus-libsql-data
  workflows-data:
    name: openstatus-workflows-data

services:
  libsql:
    image: ghcr.io/tursodatabase/libsql-server:latest
    container_name: openstatus-libsql
    networks:
      - openstatus
    expose:
      - "8080"
    volumes:
      - libsql-data:/var/lib/sqld
    environment:
      - SQLD_NODE=primary
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  tinybird:
    image: tinybirdco/tinybird-local:latest
    container_name: openstatus-tinybird
    networks:
      - openstatus
    expose:
      - "7181"
    environment:
      - COMPATIBILITY_MODE=1
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  workflows:
    image: ghcr.io/openstatushq/openstatus-workflows:latest
    container_name: openstatus-workflows
    networks:
      - openstatus
    expose:
      - "3000"
    volumes:
      - workflows-data:/app/data
    environment:
      - DATABASE_URL=${DATABASE_URL:-http://libsql:8080}
      - DATABASE_AUTH_TOKEN=${DATABASE_AUTH_TOKEN:-}
      - PORT=3000
    depends_on:
      libsql:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  server:
    image: ghcr.io/openstatushq/openstatus-server:latest
    container_name: openstatus-server
    networks:
      - openstatus
    expose:
      - "3000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-http://libsql:8080}
      - DATABASE_AUTH_TOKEN=${DATABASE_AUTH_TOKEN:-}
      - PORT=3000
    depends_on:
      libsql:
        condition: service_started
      workflows:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  private-location:
    image: ghcr.io/openstatushq/openstatus-private-location:latest
    container_name: openstatus-private-location
    networks:
      - openstatus
    expose:
      - "8080"
    environment:
      - DB_URL=${DATABASE_URL:-http://libsql:8080}
      - TINYBIRD_URL=${TINYBIRD_URL:-http://tinybird:7181}
      - GIN_MODE=release
      - PORT=8080
    depends_on:
      server:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  checker:
    image: ghcr.io/openstatushq/openstatus-checker:latest
    container_name: openstatus-checker
    networks:
      - openstatus
    expose:
      - "8080"
    environment:
      - DATABASE_URL=${DATABASE_URL:-http://libsql:8080}
      - DATABASE_AUTH_TOKEN=${DATABASE_AUTH_TOKEN:-}
      - PORT=8080
    depends_on:
      server:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  dashboard:
    image: ghcr.io/openstatushq/openstatus-dashboard:latest
    container_name: openstatus-dashboard
    networks:
      - openstatus
    expose:
      - "3000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-http://libsql:8080}
      - DATABASE_AUTH_TOKEN=${DATABASE_AUTH_TOKEN:-}
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - AUTH_TRUST_HOST=true
    depends_on:
      libsql:
        condition: service_started
      workflows:
        condition: service_started
      server:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  status-page:
    image: ghcr.io/openstatushq/openstatus-status-page:latest
    container_name: openstatus-status-page
    networks:
      - openstatus
    expose:
      - "3000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-http://libsql:8080}
      - DATABASE_AUTH_TOKEN=${DATABASE_AUTH_TOKEN:-}
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - AUTH_TRUST_HOST=true
    depends_on:
      libsql:
        condition: service_started
      workflows:
        condition: service_started
      server:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
