networks:
    openstatus:
        driver: bridge
        name: openstatus

volumes:
    libsql-data:
        name: openstatus-libsql-data
    workflows-data:
        name: openstatus-workflows-data

services:
    # External services
    libsql:
        expose:
          - "8080"
        container_name: openstatus-libsql
        image: ghcr.io/tursodatabase/libsql-server:latest
        networks:
            - openstatus
        volumes:
            - libsql-data:/var/lib/sqld
        environment:
            - SQLD_NODE=primary
        healthcheck:
            test: ["CMD-SHELL", "exit 0"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 5s
        restart: unless-stopped

    tinybird-local:
        expose:
          - "7181"
        container_name: openstatus-tinybird
        image: tinybirdco/tinybird-local:latest
        platform: linux/amd64
        networks:
            - openstatus
        environment:
            - COMPATIBILITY_MODE=1
        healthcheck:
            test: ["CMD-SHELL", "exit 0"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 5s
        restart: unless-stopped

    # Internal Services
    workflows:
        expose:
          - "3000"
        container_name: openstatus-workflows
        build:
            context: .
            dockerfile: apps/workflows/Dockerfile
        image: openstatus/workflows:latest
        networks:
            - openstatus
        volumes:
            - workflows-data:/app/data
        env_file:
            - .env.docker
        environment:
            - DATABASE_URL=http://libsql:8080
            - PORT=3000
        depends_on:
            libsql:
                condition: service_started
        healthcheck:
            test: ["CMD-SHELL", "exit 0"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 5s
        restart: unless-stopped

    server:
        expose:
          - "3000"
        container_name: openstatus-server
        build:
            context: .
            dockerfile: apps/server/Dockerfile
        image: openstatus/server:latest
        networks:
            - openstatus
        env_file:
            - .env.docker
        environment:
            - DATABASE_URL=http://libsql:8080
            - PORT=3000
        depends_on:
            workflows:
                condition: service_started
            libsql:
                condition: service_started
        healthcheck:
            test: ["CMD-SHELL", "exit 0"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 5s
        restart: unless-stopped

    private-location:
        expose:
          - "8080"
        container_name: openstatus-private-location
        build:
            context: apps/private-location
            dockerfile: Dockerfile
        image: openstatus/private-location:latest
        networks:
            - openstatus
        env_file:
            - .env.docker
        environment:
            - DB_URL=http://libsql:8080
            - TINYBIRD_URL=http://tinybird-local:7181
            - GIN_MODE=release
            - PORT=8080
        depends_on:
            server:
                condition: service_started
        healthcheck:
            test: ["CMD-SHELL", "exit 0"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 5s
        restart: unless-stopped

    dashboard:
        expose:
          - "3000"
        container_name: openstatus-dashboard
        build:
            context: .
            dockerfile: apps/dashboard/Dockerfile
        image: openstatus/dashboard:latest
        networks:
            - openstatus
        env_file:
            - .env.docker
        environment:
            - DATABASE_URL=http://libsql:8080
            - PORT=3000
            - HOSTNAME=0.0.0.0
            - AUTH_TRUST_HOST=true
        depends_on:
            workflows:
                condition: service_started
            libsql:
                condition: service_started
            server:
                condition: service_started
        healthcheck:
            test: ["CMD-SHELL", "exit 0"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 5s
        restart: unless-stopped

    status-page:
        expose:
          - "3000"
        container_name: openstatus-status-page
        build:
            context: .
            dockerfile: apps/status-page/Dockerfile
        image: openstatus/status-page:latest
        networks:
            - openstatus
        env_file:
            - .env.docker
        environment:
            - DATABASE_URL=http://libsql:8080
            - PORT=3000
            - HOSTNAME=0.0.0.0
            - AUTH_TRUST_HOST=true
        depends_on:
            workflows:
                condition: service_started
            libsql:
                condition: service_started
            server:
                condition: service_started
        healthcheck:
            test: ["CMD-SHELL", "exit 0"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 5s
        restart: unless-stopped

