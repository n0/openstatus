# documentation: https://docs.openstatus.dev
# slogan: Open-source uptime monitoring and status pages
# category: monitoring
# tags: monitoring, status, uptime, statuspage, open-source, self-hosted
# logo: svgs/openstatus.svg

services:
  libsql:
    image: ghcr.io/tursodatabase/libsql-server:latest
    environment:
      - SQLD_NODE=primary
    volumes:
      - openstatus-libsql:/var/lib/sqld
    healthcheck:
      test: ['CMD-SHELL', 'perl -e ''use IO::Socket::INET; exit(IO::Socket::INET->new(PeerAddr=>"127.0.0.1:8080",Timeout=>1) ? 0 : 1);''']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  db-migrate:
    image: oven/bun:1.3.6
    user: "0:0"
    environment:
      - DATABASE_URL=http://libsql:8080
      - DATABASE_AUTH_TOKEN=
    depends_on:
      libsql:
        condition: service_healthy
    working_dir: /work
    command:
      - sh
      - -c
      - |
        set -e
        apt-get update -qq && apt-get install -y -qq curl ca-certificates >/dev/null
        echo "fetching openstatus repo for migration scripts..."
        curl -sL https://github.com/openstatusHQ/openstatus/archive/refs/heads/main.tar.gz | tar xz -C /work --strip-components=1
        cd /work/packages/db
        bun install --silent
        bun run migrate
        echo "migrations complete."
    restart: 'no'



  workflows:
    image: ghcr.io/openstatushq/openstatus-workflows:latest
    environment:
      - TINYBIRD_URL=http://tinybird:7181
      - TINY_BIRD_API_KEY=${SERVICE_PASSWORD_TINYBIRD}
      - RESEND_API_KEY=${SERVICE_PASSWORD_RESENDKEY}
      - DATABASE_URL=http://libsql:8080
      - DATABASE_AUTH_TOKEN=
      - PORT=3000
      - CRON_SECRET=${SERVICE_PASSWORD_CRONSECRET}
      - AXIOM_TOKEN=
      - AXIOM_DATASET=
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', "wget --spider -q http://localhost:3000/ping || exit 0"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  server:
    image: ghcr.io/openstatushq/openstatus-server:latest
    environment:
      - SERVICE_FQDN_SERVER_3000
      - DATABASE_URL=http://libsql:8080
      - DATABASE_AUTH_TOKEN=
      - PORT=3000
      - NODE_ENV=production
      - FLY_REGION=ams
      - TINYBIRD_URL=http://tinybird:7181
      - UNKEY_API_ID=${SERVICE_PASSWORD_UNKEYAPI}
      - UNKEY_TOKEN=${SERVICE_PASSWORD_UNKEYTOKEN}
      - TINY_BIRD_API_KEY=${SERVICE_PASSWORD_TINYBIRD}
      - UPSTASH_REDIS_REST_URL=http://localhost:6379
      - UPSTASH_REDIS_REST_TOKEN=${SERVICE_PASSWORD_REDISTOKEN}
      - CRON_SECRET=${SERVICE_PASSWORD_CRONSECRET}
      - SCREENSHOT_SERVICE_URL=https://example.invalid
      - QSTASH_TOKEN=${SERVICE_PASSWORD_QSTASHTOKEN}
      - SUPER_ADMIN_TOKEN=${SERVICE_PASSWORD_SUPERADMIN}
      - RESEND_API_KEY=${SERVICE_PASSWORD_RESENDKEY}
      - AXIOM_TOKEN=
      - AXIOM_DATASET=
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      workflows:
        condition: service_started
    healthcheck:
      test: ['CMD-SHELL', "wget --spider -q http://localhost:3000/ping || exit 0"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  dashboard:
    image: openstatus-dashboard-patched:latest
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    environment:
      - SERVICE_FQDN_DASHBOARD_3000
      - DATABASE_URL=http://libsql:8080
      - DATABASE_AUTH_TOKEN=
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NODE_ENV=production
      - SELF_HOST=true
      - AUTH_TRUST_HOST=true
      - AUTH_URL=${SERVICE_URL_DASHBOARD}
      - NEXT_PUBLIC_URL=${SERVICE_URL_DASHBOARD}
      - AUTH_SECRET=${SERVICE_BASE64_64_AUTHSECRET}
      - ENCRYPTION_KEY=${SERVICE_BASE64_64_ENCRYPTIONKEY}
      - AUTH_GITHUB_ID=${AUTH_GITHUB_ID}
      - AUTH_GITHUB_SECRET=${AUTH_GITHUB_SECRET}
      - AUTH_GOOGLE_ID=
      - AUTH_GOOGLE_SECRET=
      - RESEND_API_KEY=${SERVICE_PASSWORD_RESENDKEY}
      - CRON_SECRET=${SERVICE_PASSWORD_CRONSECRET}
      - UNKEY_API_ID=${SERVICE_PASSWORD_UNKEYAPI}
      - UNKEY_TOKEN=${SERVICE_PASSWORD_UNKEYTOKEN}
      - UPSTASH_REDIS_REST_URL=http://localhost:6379
      - UPSTASH_REDIS_REST_TOKEN=${SERVICE_PASSWORD_REDISTOKEN}
      - QSTASH_TOKEN=${SERVICE_PASSWORD_QSTASHTOKEN}
      - QSTASH_CURRENT_SIGNING_KEY=${SERVICE_PASSWORD_QSTASHCUR}
      - QSTASH_NEXT_SIGNING_KEY=${SERVICE_PASSWORD_QSTASHNEXT}
      - QSTASH_URL=https://qstash.upstash.io/v1/publish/
      - TINY_BIRD_API_KEY=${SERVICE_PASSWORD_TINYBIRD}
      - TINYBIRD_URL=http://tinybird:7181
      - GCP_PROJECT_ID=self-hosted
      - GCP_LOCATION=self-hosted
      - GCP_CLIENT_EMAIL=self-hosted@self-hosted.iam
      - GCP_PRIVATE_KEY=self-hosted
      - STRIPE_SECRET_KEY=${SERVICE_PASSWORD_STRIPESEC}
      - STRIPE_WEBHOOK_SECRET_KEY=${SERVICE_PASSWORD_STRIPEHOOK}
      - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=self-hosted
      - PROJECT_ID_VERCEL=self-hosted
      - TEAM_ID_VERCEL=self-hosted
      - VERCEL_AUTH_BEARER_TOKEN=self-hosted
      - VERCEL_URL=${SERVICE_FQDN_DASHBOARD}
      - BLOB_READ_WRITE_TOKEN=self-hosted
      - NEXT_PUBLIC_OPENPANEL_CLIENT_ID=self-hosted
      - OPENPANEL_CLIENT_SECRET=self-hosted
      - PAGERDUTY_APP_ID=self-hosted
      - PLAYGROUND_UNKEY_API_KEY=self-hosted
      - SLACK_SUPPORT_WEBHOOK_URL=https://hooks.slack.com/services/self-hosted
      - TURBO_ENV_MODE=loose
      - WORKSPACES_HIDE_URL=
      - NEXT_PUBLIC_SENTRY_DSN=
      - SENTRY_AUTH_TOKEN=
      - AXIOM_TOKEN=
      - AXIOM_DATASET=
      - AUTH_DRIZZLE_URL=http://libsql:8080
      - CLICKHOUSE_URL=http://localhost:8123
      - CLICKHOUSE_USERNAME=self-hosted
      - CLICKHOUSE_PASSWORD=self-hosted
      - NODE_OPTIONS=--max-old-space-size=2048
      - ALLOWED_GITHUB_USERNAMES=${ALLOWED_GITHUB_USERNAMES}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      workflows:
        condition: service_started
      server:
        condition: service_started

  statuspage:
    image: openstatus-status-page-patched:latest
    build:
      context: .
      dockerfile: apps/status-page/Dockerfile
    environment:
      - SERVICE_FQDN_STATUSPAGE_3000
      - DATABASE_URL=http://libsql:8080
      - DATABASE_AUTH_TOKEN=
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NODE_ENV=production
      - SELF_HOST=true
      - AUTH_URL=https://status.uswap.net
      - AUTH_TRUST_HOST=true
      - NEXT_PUBLIC_URL=https://status.uswap.net
      - RESEND_API_KEY=${SERVICE_PASSWORD_RESENDKEY}
      - CRON_SECRET=${SERVICE_PASSWORD_CRONSECRET}
      - UNKEY_API_ID=${SERVICE_PASSWORD_UNKEYAPI}
      - UNKEY_TOKEN=${SERVICE_PASSWORD_UNKEYTOKEN}
      - UPSTASH_REDIS_REST_URL=http://localhost:6379
      - UPSTASH_REDIS_REST_TOKEN=${SERVICE_PASSWORD_REDISTOKEN}
      - TINY_BIRD_API_KEY=${SERVICE_PASSWORD_TINYBIRD}
      - TINYBIRD_URL=http://tinybird:7181
      - TINYBIRD_TOKEN=${SERVICE_PASSWORD_TINYBIRD}
      - STRIPE_SECRET_KEY=${SERVICE_PASSWORD_STRIPESEC}
      - PROJECT_ID_VERCEL=self-hosted
      - TEAM_ID_VERCEL=self-hosted
      - VERCEL_AUTH_BEARER_TOKEN=self-hosted
      - VERCEL_URL=${SERVICE_FQDN_STATUSPAGE}
      - NEXT_PUBLIC_OPENPANEL_CLIENT_ID=self-hosted
      - OPENPANEL_CLIENT_SECRET=self-hosted
      - TURBO_ENV_MODE=loose
      - NEXT_PUBLIC_SENTRY_DSN=
      - SENTRY_AUTH_TOKEN=
    depends_on:
      db-migrate:
        condition: service_completed_successfully

  plan-upgrade:
    image: curlimages/curl:8.10.1
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    entrypoint: ["sh", "-c"]
    command:
      - |
        echo "upgrading all workspaces to scale plan..."
        curl -sf -X POST http://libsql:8080/v2/pipeline \
          -H "Content-Type: application/json" \
          -d '{"requests":[{"type":"execute","stmt":{"sql":"UPDATE workspace SET plan = \"scale\"; UPDATE page SET published = 1, slug = \"status.uswap.net\" WHERE id = 1"}},{"type":"close"}]}'
        echo
        echo "verify:"
        curl -s -X POST http://libsql:8080/v2/pipeline \
          -H "Content-Type: application/json" \
          -d '{"requests":[{"type":"execute","stmt":{"sql":"SELECT id, slug, plan, name FROM workspace"}},{"type":"close"}]}'
    restart: "no"


  tinybird:
    image: tinybirdco/tinybird-local:latest
    expose:
      - "7181"
    environment:
      - COMPATIBILITY_MODE=1
      - TB_LOCAL_WORKSPACE_TOKEN=${SERVICE_PASSWORD_TINYBIRD}
    volumes:
      - openstatus-tinybird-clickhouse:/var/lib/clickhouse
      - openstatus-tinybird-metadata:/redis-data
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  private-location:
    image: ghcr.io/openstatushq/openstatus-private-location:latest
    expose:
      - "8080"
    environment:
      - DB_URL=http://libsql:8080
      - TINYBIRD_URL=http://tinybird:7181
      - GIN_MODE=release
      - PORT=8080
    depends_on:
      server:
        condition: service_started
      tinybird:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  checker:
    image: openstatus-checker-patched:latest
    build:
      context: apps/checker
      dockerfile: Dockerfile
    expose:
      - "8080"
    environment:
      - DATABASE_URL=http://libsql:8080
      - DATABASE_AUTH_TOKEN=
      - PORT=8080
      - CRON_SECRET=${SERVICE_PASSWORD_CRONSECRET}
      - TINYBIRD_URL=http://tinybird:7181
      - TINYBIRD_TOKEN=${SERVICE_PASSWORD_TINYBIRD}
      - OPENSTATUS_WORKFLOWS_URL=http://workflows:3000
      - CLOUD_PROVIDER=fly
      - FLY_REGION=ams
      - REGION=ams
      - LOG_LEVEL=info
      - AXIOM_TOKEN=
      - AXIOM_DATASET=
    depends_on:
      server:
        condition: service_started
      tinybird:
        condition: service_started
      workflows:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped


  local-scheduler:
    image: openstatus-local-scheduler:latest
    build:
      context: .
      dockerfile: selfhost/local-scheduler.Dockerfile
    depends_on:
      libsql:
        condition: service_healthy
      checker:
        condition: service_started
    environment:
      - LIBSQL_URL=http://libsql:8080
      - CHECKER_URL=http://checker:8080/checker/http?data=true
      - CRON_SECRET=${SERVICE_PASSWORD_CRONSECRET}
      - INTERVAL_SECONDS=60
    restart: unless-stopped


volumes:
  openstatus-libsql:
  openstatus-tinybird-clickhouse:
  openstatus-tinybird-metadata:




